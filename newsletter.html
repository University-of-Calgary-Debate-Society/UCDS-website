<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University of Calgary Debate Society | Newsletter Signup</title>
  <link rel="icon" href="./photos/logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="./photos/logo.png" alt="University of Calgary Debate Society logo" class="logo-image" />
        <span class="brand-text">University of Calgary Debate Society</span>
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="get-involved.html">Get Involved</a>
        <a href="events.html">Events</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <span class="eyebrow">Newsletter</span>
          <h1>Join the UCDS newsletter.</h1>
        </div>
        <p class="section-copy">Enter your email address and optional name to receive updates, announcements, and event news.</p>
        <form id="newsletterForm" class="newsletter-form">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" />

          <label for="name">Name (optional)</label>
          <input type="text" id="name" name="name" placeholder="Your name" />

          <button class="button" type="submit">Join Newsletter</button>
          <p id="newsletterMessage" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="currentYear"></span> UCDS. All rights reserved.</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
