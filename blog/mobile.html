<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:image" content="./photos/logo_seo.png" />
  <meta name="twitter:image" content="./photos/logo_seo.png" />
  <title>University of Calgary Debate Society | Blog (Mobile)</title>
  <link class="favicon" rel="icon" href="../photos/logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="../css/styles.css" />
  <script>
    (function() {
      const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) {
        window.location.replace("index.html");
      } else {
        sessionStorage.removeItem('forceDesktop');
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../">
        <img src="../photos/logo.jpg" alt="University of Calgary Debate Society logo" class="logo-image" />
        <span class="brand-text">UCDS</span>
      </a>
      <button class="menu-toggle" aria-label="Toggle navigation"><span class="hamburger"></span></button>
      <nav class="site-nav">
        <a href="../">Home</a>
        <a href="../events/">Events</a>
        <a href="../blog/">Blog</a>
        <a href="../resources/">Resources</a>
        <a href="../connect/">Connect</a>
        <a href="../join/" class="nav-join-button">Join</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <h1>UCDS Blog Posts.</h1>
        </div>
        <p class="section-copy">Our stories, insights and general thoughts on debate and the community. Read about meetings, trips, events and more.</p>
        <div id="blogList" class="cards feature-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="currentYear"></span> UCDS. All rights reserved. &bull; <a href="index.html?force=desktop" class="footer-desktop-link" style="color: #93c5fd; text-decoration: underline; margin-left: 0.5rem;">View Desktop Version</a></p>
      <div class="footer-socials">
        <a href="https://www.instagram.com/ucalgary.debate/" target="_blank" rel="noreferrer" aria-label="Instagram">
          <img src="../photos/instagram_footer.png" alt="Instagram" class="footer-social-icon" />
        </a>
        <a href="https://www.facebook.com/DebateUofC/" target="_blank" rel="noreferrer" aria-label="Facebook">
          <img src="../photos/facebook_footer.png" alt="Facebook" class="footer-social-icon" />
        </a>
        <a href="https://linktr.ee/ucds.debate" target="_blank" rel="noreferrer" aria-label="Linktree">
          <img src="../photos/linktree_footer.png" alt="Linktree" class="footer-social-icon" />
        </a>
        <a href="https://x.com/UCDebate" target="_blank" rel="noreferrer" aria-label="X (Twitter)">
          <img src="../photos/x_footer.png" alt="X (Twitter)" class="footer-social-icon" />
        </a>
        <a href="https://discord.gg/5TAG3c8TwC" target="_blank" rel="noreferrer" aria-label="Discord">
          <img src="../photos/discord_footer.png" alt="Discord" class="footer-social-icon" />
        </a>
      </div>
    </div>
  </footer>
  <script src="../scripts/script.js"></script>
</body>
</html>
