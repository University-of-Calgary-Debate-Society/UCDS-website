<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>University of Calgary Debate Society | Unsubscribe</title>
  <link rel="icon" href="../../photos/logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="../../css/styles.css" />
  <style>
    .unsubscribe-container {
      max-width: 600px;
      margin: 6rem auto;
      padding: 3.5rem 2.5rem;
      background: #112854;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
      color: #ffffff;
    }
    .unsubscribe-icon {
      width: 70px;
      height: 70px;
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid #22c55e;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #22c55e;
      font-size: 2.25rem;
      font-weight: bold;
    }
    .unsubscribe-icon.loading {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #60a5fa;
      background: transparent;
      animation: spin 1s linear infinite;
    }
    .unsubscribe-icon.error {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #ef4444;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .unsubscribe-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin: 0 0 1rem;
      letter-spacing: -0.01em;
    }
    .unsubscribe-text {
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 0 2.5rem;
    }
    .unsubscribe-email {
      color: #60a5fa;
      font-weight: 600;
      word-break: break-all;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2.25rem;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      font-size: 0.95rem;
      box-sizing: border-box;
      border: none;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff !important;
    }
    .btn-primary:hover {
      background: #3b82f6;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff !important;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    @media (max-width: 640px) {
      .unsubscribe-container {
        margin: 3rem 1rem;
        padding: 2.5rem 1.5rem;
      }
      .unsubscribe-title {
        font-size: 1.75rem;
      }
      .unsubscribe-text {
        font-size: 0.95rem;
      }
      .btn-group {
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body class="events-body">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../../">
        <img src="../../photos/logo.jpg" alt="University of Calgary Debate Society logo" class="logo-image" />
        <span class="brand-text">University of Calgary Debate Society</span>
      </a>
      <button class="menu-toggle" aria-label="Toggle navigation"><span class="hamburger"></span></button>
      <nav class="site-nav">
        <a href="../../">Home</a>
        <a href="../../events/">Events</a>
        <a href="../../blog/">Blog</a>
        <a href="../../resources/">Resources</a>
        <a href="../../connect/">Connect</a>
        <a href="../../join/" class="nav-join-button">Join</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container" style="padding: 0 10px;">
        <div class="unsubscribe-container">
          <div id="status-icon" class="unsubscribe-icon">✓</div>
          <h1 id="status-title" class="unsubscribe-title">Unsubscribed</h1>
          <p class="unsubscribe-text" id="status-text">
            You have successfully unsubscribed from our newsletter list. We're sorry to see you go!
          </p>
          <div class="btn-group" id="btn-group" style="display: none;">
            <a href="../../" class="btn btn-secondary">Go to Homepage</a>
            <button id="resubscribe-btn" class="btn btn-primary">Resubscribe</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="currentYear"></span> UCDS. All rights reserved.</p>
      <div class="footer-socials">
        <a href="https://www.instagram.com/ucalgary.debate/" target="_blank" rel="noreferrer" aria-label="Instagram">
          <img src="../../photos/instagram_footer.png" alt="Instagram" class="footer-social-icon" />
        </a>
        <a href="https://www.facebook.com/DebateUofC/" target="_blank" rel="noreferrer" aria-label="Facebook">
          <img src="../../photos/facebook_footer.png" alt="Facebook" class="footer-social-icon" />
        </a>
        <a href="https://linktr.ee/ucds.debate" target="_blank" rel="noreferrer" aria-label="Linktree">
          <img src="../../photos/linktree_footer.png" alt="Linktree" class="footer-social-icon" />
        </a>
        <a href="https://x.com/UCDebate" target="_blank" rel="noreferrer" aria-label="X (Twitter)">
          <img src="../../photos/x_footer.png" alt="X (Twitter)" class="footer-social-icon" />
        </a>
        <a href="https://discord.gg/5TAG3c8TwC" target="_blank" rel="noreferrer" aria-label="Discord">
          <img src="../../photos/discord_footer.png" alt="Discord" class="footer-social-icon" />
        </a>
      </div>
    </div>
  </footer>

  <script src="../../scripts/script.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyUmdbEzfBZbHCCgaYRG5mseiRZ7dAba0o88CSH1ywOdTiWKkeZmufL48xBJoFPYZQm2Q/exec';

    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email') || '';

    const statusIcon = document.getElementById('status-icon');
    const statusTitle = document.getElementById('status-title');
    const statusText = document.getElementById('status-text');
    const btnGroup = document.getElementById('btn-group');
    const resubscribeBtn = document.getElementById('resubscribe-btn');

    function showLoading(message) {
      statusIcon.textContent = '';
      statusIcon.className = 'unsubscribe-icon loading';
      statusTitle.textContent = 'Processing...';
      statusText.innerHTML = message;
      btnGroup.style.display = 'none';
    }

    function showSuccess(title, message, showResubscribe = false) {
      statusIcon.textContent = '✓';
      statusIcon.className = 'unsubscribe-icon';
      statusTitle.textContent = title;
      statusText.innerHTML = message;
      btnGroup.style.display = 'flex';
      if (showResubscribe && email) {
        resubscribeBtn.style.display = 'inline-flex';
      } else {
        resubscribeBtn.style.display = 'none';
      }
    }

    function showError(message) {
      statusIcon.textContent = '✗';
      statusIcon.className = 'unsubscribe-icon error';
      statusTitle.textContent = 'Error';
      statusText.innerHTML = message;
      btnGroup.style.display = 'flex';
      resubscribeBtn.style.display = 'none';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    if (email) {
      // Auto-trigger unsubscribe on load
      showLoading(`Removing <span class="unsubscribe-email">${escapeHtml(email)}</span> from our mailing list...`);

      fetch(`${WEB_APP_URL}?action=unsubscribe&email=${encodeURIComponent(email)}`, {
        method: 'GET',
        mode: 'no-cors'
      })
      .then(() => {
        // Since we are using no-cors, the promise resolves successfully when request executes
        showSuccess(
          'Unsubscribed',
          `The email address <span class="unsubscribe-email">${escapeHtml(email)}</span> has been successfully removed from our newsletter list. We're sorry to see you go!`,
          true
        );
      })
      .catch((err) => {
        console.error(err);
        showError('There was a problem processing your request. Please try again later or contact us at ucds.debate@gmail.com.');
      });
    } else {
      showError('No email address was specified. If you want to unsubscribe, please click the unsubscribe link in your newsletter email.');
    }

    resubscribeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (!email) return;

      showLoading(`Re-activating subscription for <span class="unsubscribe-email">${escapeHtml(email)}</span>...`);

      fetch(`${WEB_APP_URL}?action=resubscribe&email=${encodeURIComponent(email)}`, {
        method: 'GET',
        mode: 'no-cors'
      })
      .then(() => {
        showSuccess(
          'Resubscribed!',
          `The email address <span class="unsubscribe-email">${escapeHtml(email)}</span> has been successfully re-activated. Welcome back!`,
          false
        );
      })
      .catch((err) => {
        console.error(err);
        showError('There was a problem processing your resubscription. Please try again.');
      });
    });
  </script>
</body>
</html>
