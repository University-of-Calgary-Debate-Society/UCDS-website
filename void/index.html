<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .void-content {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
      opacity: 0;
      animation: fadeIn 3s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="void-content">
    <p>you have collapsed the boundaries.</p>
    <br><br>
    <p>there is nothing here but silence.</p>
    <p>[This section of the site is under construction :P]</p>
  </div>
</body>
</html>
